            label: Link
            type: string
      - name: materials
        label: Materiali
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Titolo
            type: string
          - name: kind
            label: Tipo
            type: string
