            type: string
      - name: accessibility
        label: Accessibilità
        type: rich-text
      - name: photoAlbums
        label: Album fotografici
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titolo album
            type: string
          - name: meta
            label: Data / luogo
            type: string
          - name: folder
            label: Cartella
            type: string
          - name: cover
            label: Immagine di copertina
            type: image
            options:
              media: images
          - name: images
            label: Fotografie dell'album
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{src}"
            fields:
              - name: src
                label: Fotografia
                type: image
                options:
                  media: images
              - name: caption
                label: Didascalia
                type: text
      - name: body
        label: Corpo storico
        type: code
        hidden: true
        readonly: true
        options:
