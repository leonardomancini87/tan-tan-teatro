media:
  - name: images
    label: Immagini
    input: public/img
    output: /img
    categories: [image]
    rename: false

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Aggiorna {path} da Pages CMS"

content:
  - name: macbett
    label: "Spettacoli — Macbett"
    type: file
    path: src/content/work/macbett.md
    format: yaml-frontmatter

    operations:
      delete: false
      rename: false

    fields:
      - name: title
        label: Titolo
        type: string
        required: true

      - name: description
        label: "Autore / opera / anno"
        type: string
        required: true

      - name: thumbnail
        label: Immagine principale
        type: image
        options:
          media: images

      - name: synopsis
        label: Sinossi
        type: rich-text

      - name: credits
        label: Scheda artistica
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Ruolo
            type: string
          - name: value
            label: Nomi / contenuto
            type: text

      - name: duration
        label: Durata
        type: string

      - name: thanks
        label: Ringraziamenti
        type: text

      - name: trailer
        label: Trailer
        type: object
        fields:
          - name: title
            label: Titolo
            type: string
          - name: url
            label: URL video
            type: string

      - name: performances
        label: Precedenti rappresentazioni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} — {name}"
        fields:
          - name: date
            label: Data
            type: string
          - name: name
            label: Evento / teatro
            type: string
          - name: details
            label: Luogo / dettagli
            type: text
          - name: url
            label: Link
            type: string

      - name: press
        label: Rassegna stampa
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author} — {title}"
        fields:
          - name: author
            label: Autore
            type: string
          - name: title
            label: Titolo
            type: string
          - name: publication
            label: Testata
            type: string
          - name: issue
            label: Numero
            type: string
          - name: date
            label: Data
            type: string
          - name: page
            label: Pagina
            type: string
          - name: url
            label: Link
            type: string

      - name: materials
        label: Materiali
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Titolo
            type: string
          - name: kind
            label: Tipo
            type: string
          - name: url
            label: File / URL
            type: string

      - name: accessibility
        label: Accessibilità
        type: rich-text

      - name: body
        label: Corpo storico
        type: code
        hidden: true
        readonly: true
        options:
          format: markdown

  - name: matrimonio
    label: "Spettacoli — Il matrimonio"
    type: file
    path: src/content/work/matrimonio.md
    format: yaml-frontmatter
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: "Autore / opera / anno"
        type: string
        required: true

      - name: originalTitle
        label: Titolo originale
        type: string

      - name: year
        label: Anno
        type: string

      - name: author
        label: Autore
        type: string
      - name: thumbnail
        label: Immagine
        type: image
        options:
          media: images
      - name: synopsis
        label: Sinossi
        type: rich-text
      - name: credits
        label: Scheda artistica
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Ruolo
            type: string
          - name: value
            label: Nomi / contenuto
            type: text
      - name: duration
        label: Durata
        type: string
      - name: trailer
        label: Trailer
        type: object
        fields:
          - name: title
            label: Titolo
            type: string
          - name: url
            label: URL video
            type: string
      - name: performances
        label: Precedenti rappresentazioni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} — {name}"
        fields:
          - name: date
            label: Data
            type: string
          - name: name
            label: Evento / teatro
            type: string
          - name: details
            label: Luogo / dettagli
            type: text
          - name: url
            label: Link
            type: string
      - name: press
        label: Rassegna stampa
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author} — {title}"
        fields:
          - name: author
            label: Autore / descrizione
            type: string
          - name: title
            label: Titolo
            type: string
          - name: publication
            label: Testata
            type: string
          - name: issue
            label: Numero
            type: string
          - name: date
            label: Data
            type: string
          - name: page
            label: Pagina
            type: string
          - name: url
            label: Link
            type: string
      - name: materials
        label: Materiali
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Titolo
            type: string
          - name: kind
            label: Tipo
            type: string
          - name: url
            label: File / URL
            type: string
      - name: accessibility
        label: Accessibilità
        type: rich-text
      - name: photoAlbums
        label: Album fotografici
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titolo album
            type: string
          - name: meta
            label: Data / luogo
            type: string
          - name: folder
            label: Cartella
            type: string
          - name: cover
            label: Immagine di copertina
            type: image
            options:
              media: images
          - name: images
            label: Fotografie dell'album
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{src}"
            fields:
              - name: src
                label: Fotografia
                type: image
                options:
                  media: images
              - name: caption
                label: Didascalia
                type: text
      - name: body
        label: Corpo storico
        type: code
        hidden: true
        readonly: true
        options:
          format: markdown

  - name: bio
    label: "Pagine — Chi siamo"
    type: file
    path: src/content/pages/bio.md
    format: yaml-frontmatter
    fields:
      - name: templateKey
        label: Template
        type: string
        hidden: true

      - name: thumbnail
        label: Immagine principale
        type: image
        description: "Immagine principale della pagina."

      - name: date
        label: Data tecnica
        type: string
        hidden: true

      - name: title
        label: Titolo
        type: string
        required: true

      - name: description
        label: Descrizione
        type: string

      - name: number
        label: Ordinamento
        type: number
        hidden: true

      - name: pagetype
        label: Tipo pagina
        type: string
        list: true
        hidden: true

      - name: featuredimage
        label: Immagine in evidenza
        type: image
        description: "Immagine in evidenza della pagina Chi siamo."

      - name: locale
        label: Lingua
        type: string
        hidden: true

      - name: translationKey
        label: Chiave traduzione
        type: string
        hidden: true

      - name: body
        label: Contenuto della pagina
        type: rich-text
        required: true
        description: "Testo completo della pagina, compresa la sezione Membri della compagnia."
        options:
          format: markdown
          switcher: true
