media:
  - name: images
    label: Immagini
    input: public/img
    output: /img
    categories: [image]
    rename: false

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Aggiorna {path} da Pages CMS"

content:
  - name: macbett
    label: "Spettacoli — Macbett"
    type: file
    path: src/content/work/macbett.md
    format: yaml-frontmatter

    operations:
      delete: false
      rename: false

    fields:
      - name: title
        label: Titolo
        type: string
        required: true

      - name: description
        label: "Autore / opera / anno"
        type: string
        required: true

      - name: thumbnail
        label: Immagine principale
        type: image
        options:
          media: images

      - name: synopsis
        label: Sinossi
        type: rich-text

      - name: credits
        label: Scheda artistica
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Ruolo
            type: string
          - name: value
            label: Nomi / contenuto
            type: text

      - name: duration
        label: Durata
        type: string

      - name: thanks
        label: Ringraziamenti
        type: text

      - name: trailer
        label: Trailer
        type: object
        fields:
          - name: title
            label: Titolo
            type: string
          - name: url
            label: URL video
            type: string

      - name: performances
        label: Precedenti rappresentazioni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} — {name}"
        fields:
          - name: date
            label: Data
            type: string
          - name: name
            label: Evento / teatro
            type: string
          - name: details
            label: Luogo / dettagli
            type: text
          - name: url
            label: Link
            type: string

      - name: press
        label: Rassegna stampa
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author} — {title}"
        fields:
          - name: author
            label: Autore
            type: string
          - name: title
            label: Titolo
            type: string
          - name: publication
            label: Testata
            type: string
          - name: issue
            label: Numero
            type: string
          - name: date
            label: Data
            type: string
          - name: page
            label: Pagina
            type: string
          - name: url
            label: Link
            type: string

      - name: materials
        label: Materiali
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Titolo
            type: string
          - name: kind
            label: Tipo
            type: string
          - name: url
            label: File / URL
            type: string

      - name: accessibility
        label: Accessibilità
        type: rich-text

      - name: body
        label: Corpo storico
        type: code
        hidden: true
        readonly: true
        options:
          format: markdown
